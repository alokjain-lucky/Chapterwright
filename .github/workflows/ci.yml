name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      - run: composer install --no-progress --prefer-dist

      - run: composer lint

  build:
    name: Build admin app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

  phpunit:
    name: PHP unit tests
    runs-on: ubuntu-latest
    steps:
      # wp-env's "plugins": ["."] (see .wp-env.json) mounts and activates
      # this directory inside the WP container at
      # wp-content/plugins/<folder-name>, and both package.json's test:php
      # script and tests/bootstrap.php hardcode that folder as
      # "make-a-book". actions/checkout@v4 defaults to a folder matching
      # this repo's GitHub name, "Make-a-Book" (capitalized) — a case
      # mismatch that breaks the container mount on Linux's case-sensitive
      # filesystem ("chdir ... no such file or directory"). Pin the
      # checkout path so it matches what every other script expects.
      - uses: actions/checkout@v4
        with:
          path: make-a-book

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: make-a-book/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      - run: npm ci
        working-directory: make-a-book

      # The WP core test bootstrap (called from tests/bootstrap.php) requires
      # the PHPUnit Polyfills library — see yoast/phpunit-polyfills in
      # composer.json — to be installed and locatable, or it aborts before
      # any test runs.
      - run: composer install --no-progress --prefer-dist
        working-directory: make-a-book

      # wp-env spins up WordPress and a dedicated test-database container
      # (Docker, already available on this runner) and provisions the WP
      # core PHPUnit test library — see .wp-env.json's testsPort.
      - run: npx wp-env start
        working-directory: make-a-book

      - run: npm run test:php
        working-directory: make-a-book
